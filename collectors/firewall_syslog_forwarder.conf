# Firewall Syslog Forwarder
#
# Starter rsyslog configuration.
# Adjust the destination and protocol to match your SIEM architecture.

module(load="imudp")
input(type="imudp" port="514")

template(
  name="FirewallForwardFormat"
  type="string"
  string="<%PRI%>%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n"
)

*.* action(
  type="omfwd"
  target="YOUR-SIEM-ENDPOINT"
  port="514"
  protocol="tcp"
  template="FirewallForwardFormat"
)
